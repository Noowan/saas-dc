 neighbor 172.16.1.7 local-as 65002 no-prepend replace-as
 neighbor 172.16.1.9 peer-group UNDERLAY
 neighbor 172.16.1.9 remote-as 65105
 neighbor 172.16.1.9 local-as 65002 no-prepend replace-as
 neighbor 172.16.1.11 peer-group UNDERLAY
 neighbor 172.16.1.11 remote-as 65106
 neighbor 172.16.1.11 local-as 65002 no-prepend replace-as
 neighbor 172.16.1.13 peer-group UNDERLAY
 neighbor 172.16.1.13 remote-as 65107
 neighbor 172.16.1.13 local-as 65002 no-prepend replace-as
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  neighbor UNDERLAY activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor EVPN activate
  neighbor EVPN route-reflector-client
 exit-address-family
exit
!
end
