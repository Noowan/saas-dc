frr version 10.7.1_git
frr defaults traditional
hostname spine-2
log stdout
service integrated-vtysh-config
!
vrf vrf-MGMT
exit-vrf
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor EVPN peer-group
 neighbor UNDERLAY peer-group
 neighbor 10.255.0.11 peer-group EVPN
 neighbor 10.255.0.11 remote-as 65000
 neighbor 10.255.0.11 update-source lo
 neighbor 10.255.0.12 peer-group EVPN
 neighbor 10.255.0.12 remote-as 65000
 neighbor 10.255.0.12 update-source lo
 neighbor 10.255.0.13 peer-group EVPN
 neighbor 10.255.0.13 remote-as 65000
 neighbor 10.255.0.13 update-source lo
 neighbor 10.255.0.14 peer-group EVPN
 neighbor 10.255.0.14 remote-as 65000
 neighbor 10.255.0.14 update-source lo
 neighbor 10.255.0.15 peer-group EVPN
 neighbor 10.255.0.15 remote-as 65000
 neighbor 10.255.0.15 update-source lo
 neighbor 10.255.0.16 peer-group EVPN
 neighbor 10.255.0.16 remote-as 65000
 neighbor 10.255.0.16 update-source lo
 neighbor 10.255.0.17 peer-group EVPN
 neighbor 10.255.0.17 remote-as 65000
 neighbor 10.255.0.17 update-source lo
 neighbor 172.16.1.1 peer-group UNDERLAY
 neighbor 172.16.1.1 remote-as 65101
 neighbor 172.16.1.1 local-as 65002 no-prepend replace-as
 neighbor 172.16.1.3 peer-group UNDERLAY
 neighbor 172.16.1.3 remote-as 65102
 neighbor 172.16.1.3 local-as 65002 no-prepend replace-as
 neighbor 172.16.1.5 peer-group UNDERLAY
 neighbor 172.16.1.5 remote-as 65103
 neighbor 172.16.1.5 local-as 65002 no-prepend replace-as
 neighbor 172.16.1.7 peer-group UNDERLAY
