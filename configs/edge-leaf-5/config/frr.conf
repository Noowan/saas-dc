frr version 10.7.1_git
frr defaults traditional
hostname edge-leaf-5
log stdout
service integrated-vtysh-config
!
vrf vrf-CLIENT_A
 ip route 8.8.8.8/32 169.254.101.2
 vni 10000
exit-vrf
!
vrf vrf-CLIENT_B
 ip route 8.8.8.8/32 169.254.102.2
 vni 20000
exit-vrf
!
vrf vrf-MGMT
exit-vrf
!
router bgp 65000
 maximum-paths 64
 bgp bestpath as-path multipath-relax
 bgp router-id 10.255.0.15
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor EVPN peer-group
 neighbor UNDERLAY peer-group
 neighbor 10.255.0.1 peer-group EVPN
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.2 peer-group EVPN
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 172.16.0.8 peer-group UNDERLAY
 neighbor 172.16.0.8 remote-as 65001
 neighbor 172.16.0.8 local-as 65105 no-prepend replace-as
 neighbor 172.16.1.8 peer-group UNDERLAY
 neighbor 172.16.1.8 remote-as 65002
 neighbor 172.16.1.8 local-as 65105 no-prepend replace-as
 neighbor 203.0.113.1 remote-as 15169
 neighbor 203.0.113.1 local-as 1337 no-prepend replace-as
 !
 address-family ipv4 unicast
  network 10.255.0.15/32
  neighbor UNDERLAY activate
  neighbor 203.0.113.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor EVPN activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65000 vrf vrf-CLIENT_A
 !
 address-family ipv4 unicast
  network 8.8.8.8/32
  import vrf default
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 10.255.0.15:10000
  route-target import 65000:10000
  route-target export 65000:10000
 exit-address-family
exit
!
router bgp 65000 vrf vrf-CLIENT_B
 !
 address-family ipv4 unicast
  network 8.8.8.8/32
  import vrf default
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 10.255.0.15:20000
  route-target import 65000:20000
  route-target export 65000:20000
 exit-address-family
exit
!
end
