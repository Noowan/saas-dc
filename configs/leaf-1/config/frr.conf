frr version 10.7.1_git
frr defaults traditional
hostname leaf-1
log stdout
service integrated-vtysh-config
!
vrf vrf-CLIENT_A
 vni 10000
exit-vrf
!
vrf vrf-CLIENT_B
 vni 20000
exit-vrf
!
vrf vrf-MGMT
exit-vrf
!
interface bond20202
 evpn mh es-id 20202
 evpn mh es-sys-mac 02:00:00:02:02:02
exit
!
interface eth1
 evpn mh uplink
exit
!
interface eth2
 evpn mh uplink
exit
!
router bgp 65000
 maximum-paths 64
 bgp bestpath as-path multipath-relax
 bgp router-id 10.255.0.11
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor EVPN peer-group
 neighbor UNDERLAY peer-group
 neighbor 10.255.0.1 peer-group EVPN
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.2 peer-group EVPN
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 172.16.0.0 peer-group UNDERLAY
 neighbor 172.16.0.0 remote-as 65001
 neighbor 172.16.0.0 local-as 65101 no-prepend replace-as
 neighbor 172.16.1.0 peer-group UNDERLAY
 neighbor 172.16.1.0 remote-as 65002
 neighbor 172.16.1.0 local-as 65101 no-prepend replace-as
 !
 address-family ipv4 unicast
  network 10.255.0.11/32
  neighbor UNDERLAY activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor EVPN activate
  advertise-all-vni
  vni 20202
   rd 10.0.255.11:20202
  exit-vni
  vni 20201
   rd 10.0.255.11:20201
  exit-vni
  vni 10102
   rd 10.0.255.11:10102
  exit-vni
  vni 10101
   rd 10.0.255.11:10101
  exit-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 65000 vrf vrf-CLIENT_A
 bgp router-id 10.255.0.11
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 10.255.0.11:10000
  route-target import 65000:10000
  route-target export 65000:10000
 exit-address-family
exit
!
router bgp 65000 vrf vrf-CLIENT_B
 bgp router-id 10.255.0.11
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 10.255.0.11:20000
  route-target import 65000:20000
  route-target export 65000:20000
 exit-address-family
exit
!
end
