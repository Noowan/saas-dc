frr version 10.7.1_git
frr defaults traditional
hostname internet
log stdout
service integrated-vtysh-config
!
ip prefix-list DEFAULT-ONLY seq 1 permit 0.0.0.0/0
!
route-map SEND-DEFAULT permit 10
 match ip address prefix-list DEFAULT-ONLY
exit
!
ip route 0.0.0.0/0 Null0
!
router bgp 15169
 bgp router-id 203.0.113.1
 no bgp ebgp-requires-policy
 neighbor 203.0.113.2 remote-as 1337
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  neighbor 203.0.113.2 route-map SEND-DEFAULT out
 exit-address-family
exit
!
end
