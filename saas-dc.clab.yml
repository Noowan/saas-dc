        - "tc class replace dev eth1 parent 1: classid 1:1 htb rate 100mbit ceil
          100mbit"
        # CS6 + CS7: гарантированно 5 Мбит/с.
        - "tc class replace dev eth1 parent 1:1 classid 1:10 htb rate 5mbit ceil
          100mbit prio 0"
        - "tc qdisc replace dev eth1 parent 1:10 handle 110: fq_codel"
        # EF: гарантированно 25 Мбит/с.
        - "tc class replace dev eth1 parent 1:1 classid 1:20 htb rate 25mbit
          ceil 100mbit prio 1"
        - "tc qdisc replace dev eth1 parent 1:20 handle 120: fq_codel"
        # BE: гарантированно 70 Мбит/с.
        - "tc class replace dev eth1 parent 1:1 classid 1:30 htb rate 70mbit
          ceil 100mbit prio 2"
        - "tc qdisc replace dev eth1 parent 1:30 handle 130: fq_codel"
        # CS6 → класс 1:10.
        - "tc filter replace dev eth1 parent 1: protocol ip pref 10 u32 match ip
          dsfield 0xc0 0xfc flowid 1:10"
        # CS7 → класс 1:10.
        - "tc filter replace dev eth1 parent 1: protocol ip pref 11 u32 match ip
          dsfield 0xe0 0xfc flowid 1:10"
        # EF → класс 1:20. Остальное → default-класс 1:30.
        - "tc filter replace dev eth1 parent 1: protocol ip pref 20 u32 match ip
          dsfield 0xb8 0xfc flowid 1:20"

