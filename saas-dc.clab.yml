        - ip link set eth5 master br20202-cl-b

        # EVPN multihoming: access-подключение в L2VNI 20202. Bond содержит один физический порт.
        - ip link set dev eth4 down
        - ip link add bond20202 type bond mode 802.3ad
        - ip link set dev bond20202 type bond miimon 100 lacp_rate fast
