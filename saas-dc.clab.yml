        - ip link set dev bond20202 mtu 9000
        - ip link set dev eth4 mtu 9000
        - ip link set dev eth4 master bond20202
        # В bridge входит bond, а НЕ его физический slave.
        - ip link set dev bond20202 master br20202-cl-b
        - ip link set dev eth4 up
        - ip link set dev bond20202 up

